<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NetworkLimiter tabs</title>
  <link rel="stylesheet" href="popup.css">
  <script defer src="popup.js"></script>
</head>
<body>
  <header><div class="logo">⌁</div><div>
    <h1>NetworkLimiter</h1><small>Per-tab · Brave</small>
  </div></header>
  <main>
    <section class="panel">
      <label for="default">Default download per tab</label>
      <div class="inputrow"><input id="default" type="number" min="1" max="1000000" value="100"><span>KiB/s</span></div>
      <label class="toggle"><input type="checkbox" id="auto"><span>Automatically limit new tabs</span></label>
      <button class="primary" id="all">Apply default to all open tabs</button>
    </section>
    <div class="sectionhead"><strong>Open tabs</strong><button id="refresh">Refresh</button></div>
    <div id="tabs" role="list"></div>
    <p id="notice" role="status"></p>
    <p class="disclaimer">Browser targets have independent throttles. Tabs may still share downloads, caches or workers. Requires debugger permission; opening DevTools can detach a limit.</p>
  </main>
</body>
</html>
